name: Release

# Two ways to publish a release:
#  - Actions tab -> Release -> "Run workflow" (version is taken from app/build.gradle.kts), or
#  - push a tag like v0.2.0.
# GitHub builds a signed APK and publishes it; installed apps offer the update.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UPDATE_REPO: ${{ github.repository }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "MaterialEReader-$VERSION.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MaterialEReader-*.apk --clobber
            gh release edit "$TAG" --notes-file CHANGELOG-latest.md
          else
            gh release create "$TAG" MaterialEReader-*.apk --target "$GITHUB_SHA" \
              --title "Material eReader $VERSION" --notes-file CHANGELOG-latest.md --latest
          fi
